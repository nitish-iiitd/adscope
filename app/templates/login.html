{% extends "base.html" %}
{% block title %}Sign in &middot; {{ app_name }}{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="login-logo mx-auto mb-3"><i class="bi bi-bullseye"></i></div>
      <h1 class="h4 fw-semibold mb-1">{{ app_name }}</h1>
      <p class="text-muted small mb-0">Media planning recommendations</p>
      {% if demo_mode %}
        <span class="badge demo-badge-standalone mt-2"><i class="bi bi-beaker me-1"></i>Demo Mode</span>
      {% endif %}
    </div>

    <div class="card">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ error }}</span>
          </div>
        {% endif %}

        <form method="post" action="/login" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   maxlength="100" required autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   maxlength="200" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
