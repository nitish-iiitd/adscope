{% extends "base.html" %}
{% block title %}{{ title }} &middot; {{ app_name }}{% endblock %}

{% block content %}
<div class="card">
  <div class="errpage" style="min-height:auto;padding:var(--sp-8) var(--sp-6)">
    <div>
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none" style="margin:0 auto var(--sp-5)">
        <circle cx="32" cy="32" r="26" stroke="var(--border-strong)" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="15" stroke="var(--border-strong)" stroke-width="1.5"/>
        <path d="M32 12v-4M32 56v-4M12 32H8M56 32h-4" stroke="var(--border-strong)" stroke-width="1.5"/>
        <path d="M25 25l14 14M39 25l-14 14" stroke="var(--critical-fg)" stroke-width="2"/>
      </svg>
      <div class="errpage__code">{{ title }}</div>
      <h2 class="errpage__title">{{ title }}</h2>
      <p class="errpage__text">{{ message }}</p>
      <div class="row gap-2" style="justify-content:center">
        <a class="btn btn--secondary" href="javascript:history.back()">Go back</a>
        <a class="btn btn--primary" href="/">Back to campaigns</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
